<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary">
      <i class="bi bi-wallet2 me-2"></i>Comptes Bancaires
    </h2>
    <button class="btn btn-outline-primary" (click)="loadAccounts()">
      <i class="bi bi-arrow-clockwise me-1"></i>Actualiser
    </button>
  </div>

  <!-- Loading Spinner -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
    <p class="mt-2 text-muted">Chargement des comptes...</p>
  </div>

  <!-- Error Alert -->
  <div *ngIf="error" class="alert alert-danger" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
  </div>

  <!-- Accounts Cards -->
  <div *ngIf="!loading && !error" class="row">
    <div class="col-md-6 col-lg-4 mb-4" *ngFor="let account of accounts">
      <div class="card shadow-sm h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">{{ account.customerReference }}</h5>
          <span class="badge" [ngClass]="getStatusBadgeClass(account.status)">
            {{ account.status }}
          </span>
        </div>
        <div class="card-body">
          <h3 class="text-primary mb-3">
            {{ account.balance | number:'1.2-2' }} {{ account.currency }}
          </h3>
          <div class="mb-2">
            <small class="text-muted">
              <i class="bi bi-currency-exchange me-1"></i>
              Devise : {{ account.currency }}
            </small>
          </div>
          <div class="mb-2">
            <small class="text-muted">
              <i class="bi bi-hash me-1"></i>
              ID : {{ account.id | slice:0:8 }}...
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- No Data -->
  <div *ngIf="!loading && !error && accounts.length === 0" class="text-center py-5">
    <i class="bi bi-inbox display-4 text-muted"></i>
    <p class="mt-3 text-muted">Aucun compte disponible</p>
  </div>
</div>
